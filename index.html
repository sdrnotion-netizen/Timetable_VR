<style>

:root{
  --bg:#f2ede6;--paper:#fffdf8;--ink:#1a1614;--inkm:#7a7068;
  --p5:#1a5c8a;--p5l:#d8ecf8;--p5m:#9ac6e0;

  --rev:#2a7a4a;--revl:#d4f0e0;--revm:#8cd0aa;
  --red:#d94030;--bdr:#ddd8d0;--chk:#2a7a4a;--hh:148px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding-top:var(--hh);}

/* FIXED HEADER */
.fh{position:fixed;top:0;left:0;right:0;z-index:999;background:var(--ink);padding:10px 16px 8px;box-shadow:0 3px 16px rgba(0,0,0,.3);}
.fh-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.fh-title{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:900;color:#fff;line-height:1.1;}
.fh-sub{font-size:.6rem;color:rgba(255,255,255,.48);margin-top:2px;}
.fh-pct{font-family:'DM Mono',monospace;font-size:1.4rem;font-weight:500;color:#6ddc9a;line-height:1;}
.bw{background:rgba(255,255,255,.12);border-radius:99px;height:5px;overflow:hidden;margin-bottom:5px;}
.bar{height:100%;border-radius:99px;background:linear-gradient(90deg,#2a7a4a,#6ddc9a);transition:width .5s;width:0%;}
.fh-cnt{font-size:.6rem;color:rgba(255,255,255,.42);margin-bottom:7px;}
.chips{display:flex;gap:6px;margin-bottom:8px;}
.chip{font-family:'DM Mono',monospace;font-size:.57rem;font-weight:500;padding:3px 9px;border-radius:99px;white-space:nowrap;}
.cp5{background:rgba(26,92,138,.35);color:#8cc8e8;border:1px solid rgba(26,92,138,.4);}
.cp6{background:rgba(90,62,140,.35);color:#c8aaf0;border:1px solid rgba(90,62,140,.4);}
.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding-bottom:2px;}
.tabs::-webkit-scrollbar{display:none;}
.tb{flex-shrink:0;padding:4px 11px;border-radius:99px;border:1.5px solid rgba(255,255,255,.18);background:transparent;color:rgba(255,255,255,.5);font-size:.65rem;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:'DM Sans',sans-serif;}
.tb.a-all{border-color:#fff;background:rgba(255,255,255,.14);color:#fff;}
.tb.a-p5{border-color:var(--p5m);background:rgba(26,92,138,.3);color:#8cc8e8;}
.tb.a-p6a{border-color:var(--p6am);background:rgba(179,88,0,.3);color:#f4b07a;}
.tb.a-p6b{border-color:var(--p6bm);background:rgba(90,62,140,.3);color:#c8aaf0;}
.tb.a-rev{border-color:var(--revm);background:rgba(42,122,74,.3);color:#8cd0aa;}

/* CONTENT */
.wrap{padding:14px 14px 90px;max-width:680px;margin:0 auto;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.leg{display:flex;align-items:center;gap:5px;font-size:.68rem;color:var(--inkm);font-weight:500;}
.ld{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

/* DAY BLOCK */
.day{background:var(--paper);border:1px solid var(--bdr);border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.day-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;background:var(--ink);color:#fff;}
.day-lbl{font-family:'Playfair Display',serif;font-size:.92rem;font-weight:700;color:#fff;}
.day-dt{font-family:'DM Mono',monospace;font-size:.67rem;color:rgba(255,255,255,.58);}
.dbadge{font-size:.58rem;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(109,220,154,.2);color:#6ddc9a;border:1px solid rgba(109,220,154,.3);}

/* SLOT */
.slot{border-top:1px solid var(--bdr);padding:12px 15px;}
.slot-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px;}
.sbadge{flex-shrink:0;margin-top:1px;font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 7px;border-radius:5px;white-space:nowrap;}
.slot.p5 .sbadge{background:var(--p5l);color:var(--p5);}
.slot.p6a .sbadge{background:var(--p6al);color:var(--p6a);}
.slot.p6b .sbadge{background:var(--p6bl);color:var(--p6b);}
.slot.rev .sbadge{background:var(--revl);color:var(--rev);}
.sinfo{flex:1;}
.schap{font-size:.68rem;color:var(--inkm);font-weight:500;margin-bottom:2px;display:flex;align-items:center;gap:6px;}
.stitle{font-size:.88rem;font-weight:600;color:var(--ink);line-height:1.35;}
.pp{display:inline-block;font-size:.52rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:middle;}
.pp3{background:#fff3cd;color:#7a5c00;}
.pp1{background:#ebebeb;color:#555;}
.ppr{background:var(--revl);color:var(--rev);}

/* SM day pips */
.pips{display:inline-flex;gap:3px;align-items:center;}
.pip{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--p6b);background:transparent;}
.pip.on{background:var(--p6b);}

/* TASKS */
.tasks{display:flex;flex-wrap:wrap;gap:6px;}
.ti{display:flex;align-items:center;gap:6px;font-size:.77rem;color:var(--inkm);cursor:pointer;padding:5px 9px;border:1px solid var(--bdr);border-radius:7px;background:var(--bg);user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:all .15s;}
.ti:active{transform:scale(.96);}
.ti.chk{border-color:var(--chk);background:var(--revl);color:var(--rev);font-weight:500;}
.ti.chk .cb{background:var(--chk);border-color:var(--chk);}
.ti.chk .cb::after{display:block;}
.cb{width:14px;height:14px;border:1.5px solid #bbb;border-radius:3px;flex-shrink:0;background:#fff;position:relative;transition:all .15s;}
.cb::after{display:none;content:'';position:absolute;left:3px;top:0;width:5px;height:8px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(40deg);}

/* REVISION DAY */
.revday{background:#f0faf5;border:1.5px solid var(--revm);border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 10px rgba(42,122,74,.1);}
.revday .day-hdr{background:var(--rev);}
.revday .day-dt{color:rgba(255,255,255,.65);}

/* EXAM */
.exam-card{background:linear-gradient(135deg,#d94030 0%,#a82e22 100%);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(217,64,48,.35);}
.ex-date{font-family:'DM Mono',monospace;font-size:.65rem;opacity:.8;}
.ex-title{font-weight:700;font-size:1.05rem;margin-top:4px;}
.ex-sub{font-size:.75rem;opacity:.85;margin-top:5px;}

/* TODAY MARKER */
.tm{display:flex;align-items:center;gap:6px;margin:8px 0;}
.tl{flex:1;height:2px;background:var(--red);border-radius:1px;}
.tp{background:var(--red);color:#fff;font-size:.62rem;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap;}

/* FAB & TOAST */
.fab{position:fixed;bottom:22px;right:16px;width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;border:none;font-size:1.2rem;box-shadow:0 4px 16px rgba(0,0,0,.28);cursor:pointer;z-index:500;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.fab:active{transform:scale(.9);}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:7px 16px;border-radius:99px;font-size:.75rem;font-weight:500;opacity:0;pointer-events:none;z-index:998;transition:opacity .25s,transform .25s;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

    slots:[
      { subj:"p6a", badge:"P6A Fin. Mgmt", pri:"rev",
        title:"P6A Final: Short Notes + All Formulas + Any Remaining Weak Areas",
        tasks:["Read All P6A Short Notes","Formula Quick-Fire Drill","Pack Stationery & Hall Ticket 🎒"] },
      { subj:"p6b", badge:"P6B Strat. Mgmt", pri:"rev",
        title:"P6B Final: Short Notes + Key Frameworks + Any Remaining Weak Areas",
        tasks:["Read All P6B Short Notes","Revise Key Frameworks","Sleep Early 🌙"] }
    ]
  },

  /* ── Wed 13 May ── P6 EXAM */
  { date:"13 May", day:"Wednesday", type:"exam",
    title:"P6A Financial Mgmt & P6B Strategic Mgmt — EXAM DAY 🎯",
    sub:"Two papers, one day — pace yourself smartly. Attempt FM and SM with full confidence. Best of luck! 🌟" },
];

// ══ STATE ══
const SK='ca_g2_parallel_v2';
let checked={}, curFilt='all';

function load(){try{const s=localStorage.getItem(SK);if(s)checked=JSON.parse(s);}catch(e){}}
function save(){try{localStorage.setItem(SK,JSON.stringify(checked));}catch(e){}}
function tk(date,si,ti){return `${date.replace(/ /g,'_')}_${si}_${ti}`;}

function toggle(key){
  checked[key]=!checked[key];
  save();render();
  showToast(checked[key]?'✅ Task done!':'↩️ Unmarked');
}
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1600);
}

function updateProgress(){
  let tot=0,don=0;
  DAYS.forEach(d=>{
    if(!d.slots)return;
    d.slots.forEach((s,si)=>{s.tasks.forEach((_,ti)=>{tot++;if(checked[tk(d.date,si,ti)])don++;});});
  });
  const pct=tot?Math.round(don/tot*100):0;
  document.getElementById('hBar').style.width=pct+'%';
  document.getElementById('hPct').textContent=pct+'%';
  document.getElementById('hCnt').textContent=`${don} / ${tot} tasks completed`;
}

function updateCountdown(){
  const now=new Date();now.setHours(0,0,0,0);
  const p5=Math.ceil((new Date(2026,4,11)-now)/86400000);
  const p6=Math.ceil((new Date(2026,4,13)-now)/86400000);
  document.getElementById('p5d').textContent=p5>0?p5:(p5===0?'🎯 TODAY':'Done');
  document.getElementById('p6d').textContent=p6>0?p6:(p6===0?'🎯 TODAY':'Done');
}

function parseDt(s){
  const m={Jan:0,Feb:1,Mar:2,Apr:3,May:4};
  const[d,mo]=s.split(' ');return new Date(2026,m[mo],+d);
}

function filt(f,btn){
  curFilt=f;
  document.querySelectorAll('.tb').forEach(b=>b.className='tb');
  btn.classList.add('a-'+f);render();
}
function goToday(){
  const el=document.getElementById('today-anchor');
  if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
  else showToast('🎉 All done — Exam time!');
}

function priBadge(p){
  if(p==='3/4')return`<span class="pp pp3">3/4 Priority</span>`;
  if(p==='1/4')return`<span class="pp pp1">1/4 Priority</span>`;
  return`<span class="pp ppr">Revision</span>`;
}

function smPips(day,of){
  let h='<span class="pips">';
  for(let i=1;i<=of;i++)h+=`<div class="pip${i<=day?' on':''}"></div>`;
  return h+'</span>';
}

function slotVisible(s){
  if(curFilt==='all')return true;
  if(curFilt==='rev')return s.pri==='rev';
  return s.subj===curFilt;
}

function buildSlots(d,slotsArr){
  let h='';
  slotsArr.forEach((s,si)=>{
    if(!slotVisible(s))return;
    const realIdx=d.slots.indexOf(s);
    const tasksH=s.tasks.map((t,ti)=>{
      const key=tk(d.date,realIdx,ti);
      const c=!!checked[key];
      return`<div class="ti${c?' chk':''}" onclick="toggle('${key}')"><div class="cb"></div><span>${t}</span></div>`;
    }).join('');
    const chapH=s.chap?`<div class="schap">${s.chap}${s.smDay!==undefined?smPips(s.smDay,s.smOf):''}</div>`:'';
    h+=`<div class="slot ${s.subj}">
      <div class="slot-top">
        <span class="sbadge">${s.badge}</span>
        <div class="sinfo">${chapH}<div class="stitle">${s.title}${priBadge(s.pri)}</div></div>
      </div>
      <div class="tasks">${tasksH}</div>
    </div>`;
  });
  return h;
}

function allSlotsDone(d){
  if(!d.slots)return false;
  const visible=d.slots.filter(slotVisible);
  if(!visible.length)return false;
  return visible.every((s)=>{
    const ri=d.slots.indexOf(s);
    return s.tasks.every((_,ti)=>checked[tk(d.date,ri,ti)]);
  });
}

function render(){
  const wrap=document.getElementById('tt');
  const today=new Date();today.setHours(0,0,0,0);
  let html='',todayDone=false;

  DAYS.forEach(d=>{

    // EXAM
    if(d.type==='exam'){
      if(curFilt==='all'||curFilt==='rev'){
        html+=`<div class="exam-card">
          <div class="ex-date">${d.day}, ${d.date} 2026</div>
          <div class="ex-title">${d.title}</div>
          <div class="ex-sub">${d.sub}</div>
        </div>`;
      }
      return;
    }

    // Filter — skip days with no visible slots
    const vis=d.slots?d.slots.filter(slotVisible):[];
    if(curFilt!=='all'&&vis.length===0)return;

    const dDate=parseDt(d.date);

    // TODAY MARKER
    if(!todayDone&&dDate>=today){
      html+=`<div class="tm" id="today-anchor"><div class="tl"></div>
        <div class="tp">📍 TODAY — ${today.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'})}</div>
        <div class="tl"></div></div>`;
      todayDone=true;
    }

    const done=allSlotsDone(d);
    const doneBadge=done?'<div class="dbadge">All Done ✅</div>':'';
    const slotsHtml=buildSlots(d,d.slots);

    // REVISION DAY
    if(d.type==='rev'){
      html+=`<div class="revday">
        <div class="day-hdr">
          <div><div class="day-lbl">${d.revLabel}</div>
          <div class="day-dt">${d.day}, ${d.date} 2026 · ${d.revNote}</div></div>
          ${doneBadge}
        </div>${slotsHtml}</div>`;
      return;
    }

    // STUDY DAY
    html+=`<div class="day">
      <div class="day-hdr">
        <div><div class="day-lbl">${d.day}</div>
        <div class="day-dt">${d.date}, 2026</div></div>
        ${doneBadge}
      </div>${slotsHtml}</div>`;
  });

  wrap.innerHTML=html;
  updateProgress();
}

load();updateCountdown();render();
setTimeout(goToday,350);
</script>
</body>
</html>
