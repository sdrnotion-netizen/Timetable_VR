<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>CA Inter G2 — May 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#f4f1ec;--paper:#fffdf8;--ink:#1a1614;--ink2:#4a4440;--ink3:#8a837d;
  --p5:#1a5c8a;--p5l:#d8ecf8;--p5m:#7fbfe0;
  --p6a:#b85500;--p6al:#fde8d0;--p6am:#f0a860;
  --p6b:#5c3a90;--p6bl:#ece0f8;--p6bm:#b898e0;
  --rev:#276b45;--revl:#d0eedd;--revm:#78c898;
  --ex:#d84030;--exl:#fde8e4;
  --bd:#ddd8d0;--sh:0 1px 8px rgba(0,0,0,0.08);--sh2:0 4px 20px rgba(0,0,0,0.13);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

/* ─── FIXED HEADER ─── */
#stickyHead{
  position:fixed;top:0;left:0;right:0;z-index:999;
  background:rgba(250,248,244,0.97);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--bd);
  box-shadow:0 2px 16px rgba(0,0,0,0.09);
  padding:12px 16px 0;
}
.ht{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.ht-title{font-family:'Playfair Display',serif;font-size:1.02rem;font-weight:900;line-height:1.2}
.ht-sub{font-size:0.66rem;color:var(--ink3);margin-top:2px}
.epills{display:flex;gap:5px;flex-shrink:0}
.ep{font-family:'DM Mono',monospace;font-size:0.58rem;font-weight:500;padding:3px 8px;border-radius:7px;text-align:center;line-height:1.4;background:var(--exl);color:var(--ex);border:1px solid #f4b8b0}
.ep b{display:block;font-size:0.75rem;font-weight:700}
.pr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pt{flex:1;background:var(--bd);border-radius:99px;height:6px;overflow:hidden}
.pf{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--rev),#5ac880);transition:width .5s ease}
.pp{font-family:'DM Mono',monospace;font-size:0.8rem;font-weight:500;color:var(--rev);min-width:32px}
.pc{font-size:0.67rem;color:var(--ink3);white-space:nowrap}
.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:5px 13px;border:1.5px solid var(--bd);border-radius:99px;background:transparent;font-family:'DM Sans',sans-serif;font-size:0.7rem;font-weight:600;color:var(--ink3);cursor:pointer;transition:all .15s;white-space:nowrap}
.tab.on-all{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on-p5{background:var(--p5l);border-color:var(--p5);color:var(--p5)}
.tab.on-p6a{background:var(--p6al);border-color:var(--p6a);color:var(--p6a)}
.tab.on-p6b{background:var(--p6bl);border-color:var(--p6b);color:var(--p6b)}
.tab.on-rev{background:var(--revl);border-color:var(--rev);color:var(--rev)}

/* ─── WRAP ─── */
.wrap{padding:16px 14px 80px;max-width:640px;margin:0 auto}
.stats{display:flex;gap:7px;margin-bottom:14px}
.sb{flex:1;background:var(--paper);border:1px solid var(--bd);border-radius:10px;padding:9px 8px;text-align:center;box-shadow:var(--sh)}
.sn{font-family:'DM Mono',monospace;font-size:1.05rem;font-weight:500;line-height:1}
.sl{font-size:0.6rem;color:var(--ink3);margin-top:3px;font-weight:500}
.sn.cp5{color:var(--p5)}.sn.cp6a{color:var(--p6a)}.sn.cp6b{color:var(--p6b)}.sn.crev{color:var(--rev)}
.legend{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.leg{display:flex;align-items:center;gap:5px;font-size:0.69rem;font-weight:500;color:var(--ink3)}
.ld{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ─── PHASE ─── */
.phd{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-family:'Playfair Display',serif;font-size:0.88rem;font-weight:700}
.phd .bar{flex:1;height:1px;background:var(--bd)}
.phd .ptag{font-family:'DM Mono',monospace;font-size:0.6rem;font-weight:500;padding:2px 7px;border-radius:99px;white-space:nowrap;background:#f0ece5;color:var(--ink3)}

/* ─── TODAY MARKER ─── */
.tday{display:flex;align-items:center;gap:7px;margin:12px 0}
.tday .tl{flex:1;height:2px;background:var(--ex)}
.tday .tp{background:var(--ex);color:#fff;font-size:0.62rem;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}

/* ─── DIVIDER ─── */
.rdiv{display:flex;align-items:center;gap:7px;margin:5px 0;font-size:0.67rem;color:var(--rev);font-weight:600;opacity:.75}
.rdiv .dl{flex:1;height:1px;background:var(--revm)}

/* ─── CARD ─── */
.card{
  background:var(--paper);border:1px solid var(--bd);border-left:4px solid var(--bd);
  border-radius:12px;padding:12px 13px;margin-bottom:8px;
  box-shadow:var(--sh);position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;top:0;right:0;width:55px;height:55px;border-radius:0 12px 0 55px;opacity:.055}
.card.p5{border-left-color:var(--p5)}.card.p5::before{background:var(--p5)}
.card.p6a{border-left-color:var(--p6a)}.card.p6a::before{background:var(--p6a)}
.card.p6b{border-left-color:var(--p6b)}.card.p6b::before{background:var(--p6b)}
.card.rev{border-left-color:var(--rev);background:#f6fdf8}.card.rev::before{background:var(--rev)}
.card.excard{border-left-color:var(--ex);background:var(--exl)}.card.excard::before{background:var(--ex)}
.card.tcard{box-shadow:var(--sh2);border-color:#c0b8b0}
.card.adone{opacity:.42}

.ctop{display:flex;align-items:flex-start;gap:9px}
.dchip{font-family:'DM Mono',monospace;font-size:0.64rem;font-weight:500;padding:3px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.p5 .dchip{background:var(--p5l);color:var(--p5)}.p6a .dchip{background:var(--p6al);color:var(--p6a)}
.p6b .dchip{background:var(--p6bl);color:var(--p6b)}.rev .dchip{background:var(--revl);color:var(--rev)}
.excard .dchip{background:#fde0dc;color:var(--ex)}
.ci{flex:1;min-width:0}
.csub{font-size:0.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:2px}
.p5 .csub{color:var(--p5)}.p6a .csub{color:var(--p6a)}.p6b .csub{color:var(--p6b)}.rev .csub{color:var(--rev)}.excard .csub{color:var(--ex)}
.ctitle{font-size:0.89rem;font-weight:600;line-height:1.35;color:var(--ink)}
.pb{display:inline-block;font-size:0.54rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:middle}
.b3{background:#fff3cd;color:#7a5c00}.b1{background:#ebebeb;color:#555}.br{background:var(--revl);color:var(--rev)}
.dring{width:28px;height:28px;flex-shrink:0;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.85rem;background:#fff;transition:all .2s;margin-top:1px}
.dring.done{background:var(--rev);border-color:var(--rev);color:#fff}

/* ─── TASKS ─── */
.tasks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.task{display:flex;align-items:center;gap:6px;font-size:0.77rem;color:var(--ink2);cursor:pointer;padding:7px 11px;border:1.5px solid var(--bd);border-radius:8px;background:var(--bg);transition:all .15s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.task:active{transform:scale(.96)}
.task.ck{border-color:var(--rev);background:var(--revl);color:var(--rev);font-weight:500}
.task.ck .box{background:var(--rev);border-color:var(--rev)}
.task.ck .box::after{display:block}
.box{width:15px;height:15px;border:1.5px solid #bbb;border-radius:3px;flex-shrink:0;position:relative;background:#fff;transition:all .15s}
.box::after{display:none;content:'';position:absolute;left:3px;top:0;width:6px;height:10px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(40deg)}

/* ─── EXAM BANNER ─── */
.exbanner{background:linear-gradient(135deg,#e04535,#b83020);color:#fff;border-radius:12px;padding:15px 16px;margin-bottom:8px;box-shadow:0 6px 22px rgba(210,60,40,.28)}
.exb-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.exb-info .exb-dt{font-family:'DM Mono',monospace;font-size:0.63rem;opacity:.82}
.exb-info .exb-nm{font-weight:700;font-size:0.97rem;line-height:1.25;margin-top:2px}
.exb-info .exb-note{font-size:0.73rem;opacity:.88;margin-top:4px}
.exb-cd{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;background:rgba(255,255,255,.15);border-radius:10px;padding:7px 11px;text-align:center;flex-shrink:0;min-width:56px;line-height:1}
.exb-cd small{display:block;font-size:.5rem;opacity:.8;font-weight:400;letter-spacing:.6px;margin-top:2px}

/* ─── TOAST & FAB ─── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(70px);background:#1a1614;color:#fff;padding:9px 20px;border-radius:99px;font-size:0.77rem;font-weight:500;z-index:9999;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.25);white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.fab{position:fixed;bottom:22px;right:16px;width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;border:none;font-size:1.1rem;box-shadow:0 4px 16px rgba(0,0,0,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:998;transition:transform .15s}
.fab:active{transform:scale(.91)}
</style>
</head>

const KEY='ca_g2_v3';
let ck={},filter='all';
function load(){try{const s=localStorage.getItem(KEY);if(s)ck=JSON.parse(s)}catch(e){ck={}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ck))}catch(e){}}
function k(d,i){return d.replace(/ /g,'_')+'_'+i}
function toggle(key){ck[key]=!ck[key];save();render();showT(ck[key]?'✅ Task done!':'↩️ Unmarked')}
function showT(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600)}
function setF(f,btn){
  filter=f;
  document.querySelectorAll('.tab').forEach(b=>{b.className='tab'});
  btn.classList.add('on-'+f);
  render();
}
function pd(d){const M={Jan:0,Feb:1,Mar:2,Apr:3,May:4};const[day,mon]=d.split(' ');return new Date(2026,M[mon],parseInt(day))}
function du(d){const n=new Date();n.setHours(0,0,0,0);return Math.ceil((d-n)/(864e5))}
function updCD(){
  const p5=du(new Date(2026,4,10)),p6=du(new Date(2026,4,12));
  document.getElementById('p5d').textContent=p5>0?p5:'🎯';
  document.getElementById('p6d').textContent=p6>0?p6:'🎯';
}
function fixPad(){const h=document.getElementById('stickyHead').offsetHeight;document.getElementById('mw').style.paddingTop=(h+10)+'px'}
function goToday(){const el=document.getElementById('ta');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});else showT('No upcoming date!')}

function renderStats(){
  const c={p5:{t:0,d:0},p6a:{t:0,d:0},p6b:{t:0,d:0},rev:{t:0,d:0}};
  S.forEach(item=>{if(!item.tasks)return;const t=item.type;if(!c[t])return;item.tasks.forEach((_,i)=>{c[t].t++;if(ck[k(item.date,i)])c[t].d++;})});
  const L={p5:'P5 Audit',p6a:'P6A FM',p6b:'P6B SM',rev:'Revision'};
  const C={p5:'cp5',p6a:'cp6a',p6b:'cp6b',rev:'crev'};
  document.getElementById('stats').innerHTML=Object.keys(c).map(x=>`<div class="sb"><div class="sn ${C[x]}">${c[x].d}<span style="font-size:.6rem;opacity:.55">/${c[x].t}</span></div><div class="sl">${L[x]}</div></div>`).join('');
}

function render(){
  const today=new Date();today.setHours(0,0,0,0);
  let html='',tdone=false,total=0,done=0;

  S.forEach(item=>{
    if(item.tasks){item.tasks.forEach((_,i)=>{total++;if(ck[k(item.date,i)])done++;})}

    if(item.phase){
      if(filter==='all'||filter==='rev'){
        const col=item.pc==='rev'?'var(--rev)':item.pc==='ink3'?'var(--ink3)':'var(--ink)';
        html+=`<div class="phd" style="color:${col}"><div class="bar"></div><span>${item.phase}</span><span class="ptag">${item.pt}</span><div class="bar"></div></div>`;
      }
      return;
    }
    if(item.div){if(filter==='all'||filter==='rev')html+=`<div class="rdiv"><div class="dl"></div>${item.label}<div class="dl"></div></div>`;return;}
    if(item.exam){
      if(filter==='all'||filter==='rev'){
        const d=du(pd(item.date));
        html+=`<div class="exbanner"><div class="exb-top"><div class="exb-info"><div class="exb-dt">${item.date}, 2026</div><div class="exb-nm">${item.label}</div><div class="exb-note">${item.note}</div></div><div class="exb-cd">${d>0?d:'🎯'}<small>${d>0?'DAYS LEFT':'TODAY'}</small></div></div></div>`;
      }
      return;
    }

    if(filter!=='all'&&item.type!==filter)return;

    const iD=pd(item.date);
    if(!tdone&&iD>=today){html+=`<div class="tday" id="ta"><div class="tl"></div><div class="tp">📍 TODAY — ${today.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</div><div class="tl"></div></div>`;tdone=true;}

    const ad=item.tasks&&item.tasks.every((_,i)=>ck[k(item.date,i)]);
    const isT=iD.getTime()===today.getTime();
    const pb=item.pri==='3/4'?`<span class="pb b3">3/4</span>`:item.pri==='1/4'?`<span class="pb b1">1/4</span>`:`<span class="pb br">Rev</span>`;
    const th=item.tasks.map((t,i)=>{const key=k(item.date,i);const c=!!ck[key];return`<div class="task${c?' ck':''}" onclick="toggle('${key}')"><div class="box"></div><span>${t}</span></div>`}).join('');

    html+=`<div class="card ${item.type}${ad?' adone':''}${isT?' tcard':''}">
      <div class="ctop">
        <span class="dchip">${item.date}</span>
        <div class="ci"><div class="csub">${item.sub}</div><div class="ctitle">${item.title}${pb}</div></div>
        <div class="dring${ad?' done':''}">${ad?'✓':'○'}</div>
      </div>
      <div class="tasks">${th}</div>
    </div>`;
  });

  document.getElementById('tt').innerHTML=html;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('pp').textContent=pct+'%';
  document.getElementById('pc').textContent=`${done}/${total}`;
  renderStats();fixPad();
}

load();render();updCD();
if(!document.getElementById('tt').innerHTML.trim()){
  document.getElementById('tt').innerHTML='<div class="card"><div class="ctitle" style="color:#d84030;">Unable to render timetable. Please reload the page.</div></div>';
}
setInterval(updCD,60000);
setTimeout(goToday,500);
window.addEventListener('resize',fixPad);
</script>
</body>
</html>
