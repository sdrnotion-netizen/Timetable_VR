<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="CA Inter G2"/>
<meta name="theme-color" content="#1a1614"/>
<title>CA Inter G2 — May 2026 Timetable</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #f2ede6;
  --paper: #fffdf8;
  --ink: #1a1614;
  --ink-muted: #7a7068;
  --p5: #1a5c8a;
  --p5-light: #d8ecf8;
  --p5-mid: #9ac6e0;
  --p6a: #b35800;
  --p6a-light: #fde9d4;
  --p6a-mid: #f2b07e;
  --p6b: #5a3e8c;
  --p6b-light: #ebe4f8;
  --p6b-mid: #c2abe6;
  --rev: #2a7a4a;
  --rev-light: #d4f0e0;
  --rev-mid: #8cd0aa;
  --exam-red: #d94030;
  --border: #ddd8d0;
  --check: #2a7a4a;
  --header-h: 138px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--ink);
  padding-top: var(--header-h);
}

/* ── FIXED HEADER ── */
.fixed-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 999;
  background: var(--ink);
  padding: 10px 16px 8px;
  box-shadow: 0 3px 16px rgba(0,0,0,0.28);
}

.hdr-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 7px;
}
.hdr-title {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 900;
  color: #fff; line-height: 1.1;
}
.hdr-sub { font-size: 0.62rem; color: rgba(255,255,255,0.5); margin-top: 2px; }
.hdr-pct {
  font-family: 'DM Mono', monospace;
  font-size: 1.45rem; font-weight: 500;
  color: #6ddc9a; line-height: 1;
}

.hdr-bar-wrap {
  background: rgba(255,255,255,0.12);
  border-radius: 99px; height: 5px; overflow: hidden;
  margin-bottom: 6px;
}
.hdr-bar {
  height: 100%; border-radius: 99px;
  background: linear-gradient(90deg, #2a7a4a, #6ddc9a);
  transition: width 0.5s ease; width: 0%;
}
.hdr-count { font-size: 0.62rem; color: rgba(255,255,255,0.45); margin-bottom: 7px; }

/* exam countdown chips */
.exam-chips { display: flex; gap: 6px; margin-bottom: 8px; }
.chip {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem; font-weight: 500;
  padding: 3px 9px; border-radius: 99px;
  white-space: nowrap;
}
.chip-p5  { background: rgba(26,92,138,0.35); color: #8cc8e8; border: 1px solid rgba(26,92,138,0.4); }
.chip-p6  { background: rgba(90,62,140,0.35); color: #c8aaf0; border: 1px solid rgba(90,62,140,0.4); }

/* Tab bar */
.tab-bar {
  display: flex; gap: 5px;
  overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
  padding-bottom: 2px;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0; padding: 4px 12px;
  border-radius: 99px;
  border: 1.5px solid rgba(255,255,255,0.18);
  background: transparent;
  color: rgba(255,255,255,0.5);
  font-size: 0.68rem; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
  white-space: nowrap;
  font-family: 'DM Sans', sans-serif;
}
.tab-btn.act-all  { border-color:#fff; background:rgba(255,255,255,0.14); color:#fff; }
.tab-btn.act-p5   { border-color:var(--p5-mid); background:rgba(26,92,138,0.3); color:#8cc8e8; }
.tab-btn.act-p6a  { border-color:var(--p6a-mid); background:rgba(179,88,0,0.3); color:#f4b07a; }
.tab-btn.act-p6b  { border-color:var(--p6b-mid); background:rgba(90,62,140,0.3); color:#c8aaf0; }
.tab-btn.act-rev  { border-color:var(--rev-mid); background:rgba(42,122,74,0.3); color:#8cd0aa; }

/* ── CONTENT ── */
.wrapper { padding: 14px 14px 90px; max-width: 640px; margin: 0 auto; }

.legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 0.68rem; color: var(--ink-muted); font-weight: 500; }
.leg-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

/* Section label */
.date-section {
  display: flex; align-items: center; gap: 8px;
  margin: 20px 0 8px;
}
.date-section .ds-line { flex: 1; height: 1px; background: var(--border); }
.date-section .ds-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.67rem; font-weight: 500;
  color: var(--ink-muted); white-space: nowrap;
  background: var(--bg); padding: 0 4px;
}

/* Row card */
.row-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-left: 4px solid transparent;
  border-radius: 11px;
  padding: 12px 14px; margin-bottom: 9px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  transition: opacity 0.25s;
}
.row-card.p5  { border-left-color: var(--p5); }
.row-card.p6a { border-left-color: var(--p6a); }
.row-card.p6b { border-left-color: var(--p6b); }
.row-card.rev { border-left-color: var(--rev); background: #f5fdf8; }
.row-card.done { opacity: 0.42; }

.row-top { display: flex; align-items: flex-start; gap: 9px; }
.subj-badge {
  flex-shrink: 0; margin-top: 1px;
  font-size: 0.58rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
  padding: 3px 7px; border-radius: 5px; white-space: nowrap;
}
.p5  .subj-badge { background: var(--p5-light);  color: var(--p5); }
.p6a .subj-badge { background: var(--p6a-light); color: var(--p6a); }
.p6b .subj-badge { background: var(--p6b-light); color: var(--p6b); }
.rev .subj-badge { background: var(--rev-light);  color: var(--rev); }

.row-info { flex: 1; }
.row-date {
  font-family: 'DM Mono', monospace;
  font-size: 0.64rem; color: var(--ink-muted); margin-bottom: 2px;
}
.row-title {
  font-size: 0.88rem; font-weight: 600;
  color: var(--ink); line-height: 1.35;
}
.pri-pill {
  display: inline-block;
  font-size: 0.54rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.4px;
  padding: 1px 5px; border-radius: 4px;
  margin-left: 5px; vertical-align: middle;
}
.pri-3q { background: #fff3cd; color: #7a5c00; }
.pri-1q { background: #ebebeb; color: #555; }
.pri-rv { background: var(--rev-light); color: var(--rev); }

/* Tasks */
.tasks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.task-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.78rem; color: var(--ink-muted);
  cursor: pointer; padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 7px; background: var(--bg);
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation; transition: all 0.15s;
}
.task-item:active { transform: scale(0.96); }
.task-item.chk {
  border-color: var(--check);
  background: var(--rev-light);
  color: var(--rev); font-weight: 500;
}
.task-item.chk .cb { background: var(--check); border-color: var(--check); }
.task-item.chk .cb::after { display: block; }
.cb {
  width: 15px; height: 15px;
  border: 1.5px solid #bbb; border-radius: 3px;
  flex-shrink: 0; background: #fff;
  position: relative; transition: all 0.15s;
}
.cb::after {
  display: none; content: '';
  position: absolute; left: 3px; top: 0;
  width: 6px; height: 9px;
  border: 2px solid #fff;
  border-top: none; border-left: none;
  transform: rotate(40deg);
}

/* Exam card */
.exam-card {
  background: linear-gradient(135deg, #d94030 0%, #a82e22 100%);
  color: #fff; border-radius: 11px;
  padding: 15px 16px; margin-bottom: 9px;
  box-shadow: 0 4px 18px rgba(217,64,48,0.35);
}
.ex-date { font-family: 'DM Mono', monospace; font-size: 0.65rem; opacity: 0.8; }
.ex-title { font-weight: 700; font-size: 1rem; margin-top: 3px; }
.ex-sub   { font-size: 0.74rem; opacity: 0.85; margin-top: 4px; }

/* Revision divider */
.rev-divider {
  display: flex; align-items: center; gap: 7px;
  margin: 4px 0 8px; opacity: 0.75;
  font-size: 0.7rem; color: var(--rev); font-weight: 600;
}
.rev-divider .rl { flex: 1; height: 1px; background: var(--rev-mid); }

/* Today marker */
.today-mark {
  display: flex; align-items: center; gap: 6px; margin: 10px 0;
}
.today-mark .tl { flex: 1; height: 2px; background: var(--exam-red); border-radius: 1px; }
.today-pill {
  background: var(--exam-red); color: #fff;
  font-size: 0.62rem; font-weight: 700;
  padding: 2px 10px; border-radius: 99px; white-space: nowrap;
}

/* FAB */
.fab {
  position: fixed; bottom: 22px; right: 16px;
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--ink); color: #fff;
  border: none; font-size: 1.2rem;
  box-shadow: 0 4px 16px rgba(0,0,0,0.28);
  cursor: pointer; z-index: 500;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s;
}
.fab:active { transform: scale(0.9); }

/* Toast */
.toast {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: #fff;
  padding: 7px 16px; border-radius: 99px;
  font-size: 0.75rem; font-weight: 500;
  opacity: 0; pointer-events: none; z-index: 998;
  transition: opacity 0.25s, transform 0.25s;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  // ── GRAND REVISION : 06 May – 10 May ──
  { section: "Grand Revision — 06 May to 10 May" },

// ─── STATE ───
const STORE_KEY = 'ca_inter_g2_v3';
let checked = {};
let filter  = 'all';

function load() {
  try { const s = localStorage.getItem(STORE_KEY); if (s) checked = JSON.parse(s); } catch(e){}
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(checked)); } catch(e){}
}
function k(date, i) { return `${date.replace(/ /g,'_')}_${i}`; }

function toggle(key) {
  checked[key] = !checked[key];
  save(); render();
  showToast(checked[key] ? '✅ Task done!' : '↩️ Unmarked');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1600);
}

function updateProgress() {
  let total = 0, done = 0;
  SCHED.forEach(r => {
    if (!r.tasks) return;
    r.tasks.forEach((_,i) => { total++; if (checked[k(r.date,i)]) done++; });
  });
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('hdrBar').style.width   = pct + '%';
  document.getElementById('hdrPct').textContent   = pct + '%';
  document.getElementById('hdrCount').textContent = `${done} / ${total} tasks completed`;
}

function updateCountdowns() {
  const now   = new Date(); now.setHours(0,0,0,0);
  const p5d   = Math.ceil((new Date(2026,4,11) - now)/(86400000));
  const p6d   = Math.ceil((new Date(2026,4,13) - now)/(86400000));
  document.getElementById('p5days').textContent = p5d > 0 ? p5d : '🎯 TODAY';
  document.getElementById('p6days').textContent = p6d > 0 ? p6d : '🎯 TODAY';
}

function parseDate(d) {
  const m = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const [day,mon] = d.split(' ');
  return new Date(2026, m[mon], +day);
}

function filterBy(f, btn) {
  filter = f;
  document.querySelectorAll('.tab-btn').forEach(b => b.className = 'tab-btn');
  btn.classList.add('act-' + f);
  render();
}

function jumpToday() {
  const el = document.getElementById('today-anchor');
  if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
  else showToast('🎉 All past days completed!');
}

function pBadge(p) {
  if (p==='3/4') return `<span class="pri-pill pri-3q">3/4 Priority</span>`;
  if (p==='1/4') return `<span class="pri-pill pri-1q">1/4 Priority</span>`;
  return `<span class="pri-pill pri-rv">Revision</span>`;
}

function render() {
  const wrap = document.getElementById('timetable');
  const today = new Date(); today.setHours(0,0,0,0);
  let html = '', todayDone = false;

  // track last date to avoid duplicate today markers (05 May has 2 entries)
  let lastTodayDate = '';

  SCHED.forEach(row => {

    if (row.section) {
      if (filter === 'all' || filter === 'rev') {
        html += `<div class="date-section"><div class="ds-line"></div><span class="ds-label">${row.section}</span><div class="ds-line"></div></div>`;
      }
      return;
    }

    if (row.divider) {
      if (filter === 'all' || filter === 'rev') {
        html += `<div class="rev-divider"><div class="rl"></div>${row.divider}<div class="rl"></div></div>`;
      }
      return;
    }

    if (row.exam) {
      if (filter === 'all' || filter === 'rev') {
        html += `<div class="exam-card">
          <div class="ex-date">${row.date}, 2026</div>
          <div class="ex-title">${row.title}</div>
          <div class="ex-sub">${row.sub}</div>
        </div>`;
      }
      return;
    }

    if (filter !== 'all' && row.type !== filter) return;

    // Today marker (only once, and only once per date)
    const rDate = parseDate(row.date);
    if (!todayDone && rDate >= today && lastTodayDate !== row.date) {
      html += `<div class="today-mark" id="today-anchor">
        <div class="tl"></div>
        <div class="today-pill">📍 TODAY — ${today.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</div>
        <div class="tl"></div>
      </div>`;
      todayDone = true;
    }
    lastTodayDate = row.date;

    const allDone = row.tasks.every((_,i) => checked[k(row.date,i)]);
    const tasks = row.tasks.map((t,i) => {
      const key = k(row.date, i);
      const c = !!checked[key];
      return `<div class="task-item ${c?'chk':''}" onclick="toggle('${key}')">
        <div class="cb"></div><span>${t}</span>
      </div>`;
    }).join('');

    html += `<div class="row-card ${row.type} ${allDone?'done':''}">
      <div class="row-top">
        <span class="subj-badge">${row.subj}</span>
        <div class="row-info">
          <div class="row-date">${row.date}, 2026</div>
          <div class="row-title">${row.title} ${pBadge(row.priority)}</div>
        </div>
      </div>
      <div class="tasks">${tasks}</div>
    </div>`;
  });

  wrap.innerHTML = html;
  updateProgress();
}

load();
updateCountdowns();
render();
setTimeout(jumpToday, 350);
</script>
</body>
</html>
